<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg1: #0b1020; --bg2: #1a1f3a; --bg3: #241a4a;
    --card-bg: rgba(30, 35, 65, 0.55); --card-border: rgba(255, 255, 255, 0.12);
    --text: #eef1fb; --text-dim: #9aa3c7;
    --input-bg: rgba(15, 18, 40, 0.55); --input-border: rgba(255, 255, 255, 0.15);
    --row-bg: rgba(255,255,255,0.04); --row-border: rgba(255,255,255,0.08);
    --accent1: #6d5bff; --accent2: #4f7bff;
    --error: #ff6b7d; --ok: #4ade80;
  }
  [data-theme="light"] {
    --bg1: #dfe6fb; --bg2: #eef1ff; --bg3: #ffffff;
    --card-bg: rgba(255, 255, 255, 0.55); --card-border: rgba(120, 120, 180, 0.25);
    --text: #1b1f3a; --text-dim: #5a6088;
    --input-bg: rgba(255, 255, 255, 0.6); --input-border: rgba(90, 96, 136, 0.25);
    --row-bg: rgba(90,96,136,0.06); --row-border: rgba(90,96,136,0.15);
  }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--bg3), var(--bg2) 45%, var(--bg1) 100%);
    color: var(--text);
    min-height: 100vh; padding: 24px 16px;
    display: flex; flex-direction: column; align-items: center;
    transition: background 0.4s ease, color 0.4s ease;
  }
  .theme-toggle {
    display: flex; align-items: center; gap: 8px;
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 999px; padding: 6px 10px; margin-bottom: 20px;
    backdrop-filter: blur(12px); cursor: pointer; user-select: none;
  }
  .switch { width: 40px; height: 20px; background: rgba(0,0,0,0.2); border-radius: 999px; position: relative; }
  .switch .knob {
    position: absolute; top: 1px; right: 1px; width: 16px; height: 16px;
    border-radius: 50%; background: linear-gradient(135deg, var(--accent1), var(--accent2));
    transition: transform 0.3s ease;
  }
  [data-theme="light"] .switch .knob { transform: translateX(18px); }

  .box {
    background: var(--card-bg); border: 1px solid var(--card-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    padding: 28px; border-radius: 20px; width: 100%; max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  h1 { font-size: 19px; margin: 0 0 20px; text-align: center; }
  .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
  input {
    width: 100%; padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--input-border); background: var(--input-bg);
    color: var(--text); font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent1); }
  button {
    padding: 11px 18px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .user-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--row-bg); border: 1px solid var(--row-border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    cursor: pointer; font-size: 14px;
  }
  .user-row.selected { border-color: var(--accent1); }
  .user-row .name { font-weight: bold; }
  .user-row .total { color: var(--text-dim); font-size: 12px; }
  .panel {
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--row-border);
    display: none;
  }
  .panel.show { display: block; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  .form-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .form-row input { flex: 1; }
  #msg { text-align: center; color: var(--text-dim); font-size: 13px; min-height: 18px; margin-top: 4px; }
  .error { color: var(--error); }
  .ok { color: var(--ok); }
  .history { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .history .row {
    display: flex; justify-content: space-between;
    background: var(--row-bg); border: 1px solid var(--row-border);
    border-radius: 8px; padding: 8px 12px; font-size: 13px;
  }
  .hint { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">
    <span>☀️</span>
    <div class="switch"><div class="knob"></div></div>
    <span>🌙</span>
  </div>

  <div class="box">
    <h1>پنل مدیریت سفارش‌ها</h1>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="نام کاربری رو تایپ کنید..." />
      <button id="searchBtn">جستجو</button>
    </div>

    <div id="userList"></div>

    <div class="panel" id="panel">
      <h2 id="selectedName"></h2>
      <div class="hint">تاریخ رو به فرمت 1405/06/28 وارد کنید</div>
      <div class="form-row">
        <input id="dateInput" type="text" placeholder="تاریخ (مثلاً 1405/06/28)" />
        <input id="countInput" type="number" placeholder="تعداد" style="max-width:90px" />
      </div>
      <button id="saveBtn" style="width:100%">ثبت</button>
      <div id="msg"></div>
      <div class="history" id="history"></div>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://jmbpskxloffcrbxiqcdy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptYnBza3hsb2ZmY3JieGlxY2R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MjU3MDgsImV4cCI6MjEwNTQwMTcwOH0.ZFHwX9hg7FxyjcEV4oJRpA2Rgoh0UqL2Xj7D3IO3YMU";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const root = document.documentElement;
  const themeToggle = document.getElementById("themeToggle");
  const savedTheme = localStorage.getItem("site_theme") || "dark";
  if (savedTheme === "light") root.setAttribute("data-theme", "light");
  themeToggle.addEventListener("click", () => {
    const isLight = root.getAttribute("data-theme") === "light";
    if (isLight) { root.removeAttribute("data-theme"); localStorage.setItem("site_theme", "dark"); }
    else { root.setAttribute("data-theme", "light"); localStorage.setItem("site_theme", "light"); }
  });

  const userListEl = document.getElementById("userList");
  const panelEl = document.getElementById("panel");
  const msgEl = document.getElementById("msg");
  const historyEl = document.getElementById("history");
  let selectedUsername = null;

  async function searchUsers() {
    const term = document.getElementById("searchInput").value.trim();
    userListEl.innerHTML = "در حال جستجو...";

    let query = supabaseClient.from("profiles").select("username");
    if (term) query = query.ilike("username", "%" + term + "%");

    const { data, error } = await query;
    userListEl.innerHTML = "";

    if (error || !data || data.length === 0) {
      userListEl.innerHTML = '<div class="hint">کاربری پیدا نشد</div>';
      return;
    }

    data.forEach(user => {
      const row = document.createElement("div");
      row.className = "user-row";
      row.innerHTML = `<span class="name">${user.username}</span>`;
      row.addEventListener("click", () => selectUser(user.username, row));
      userListEl.appendChild(row);
    });
  }

  async function selectUser(username, rowEl) {
    document.querySelectorAll(".user-row").forEach(r => r.classList.remove("selected"));
    rowEl.classList.add("selected");
    selectedUsername = username;
    document.getElementById("selectedName").textContent = "ثبت سفارش برای: " + username;
    panelEl.classList.add("show");
    document.getElementById("dateInput").value = "";
    document.getElementById("countInput").value = "";
    msgEl.textContent = "";
    await loadHistory(username);
  }

  async function loadHistory(username) {
    const { data, error } = await supabaseClient
      .from("orders")
      .select("order_date, order_count")
      .eq("username", username)
      .order("order_date", { ascending: true });

    historyEl.innerHTML = "";
    if (error || !data || data.length === 0) {
      historyEl.innerHTML = '<div class="hint">هنوز سفارشی برای این کاربر ثبت نشده</div>';
      return;
    }
    data.forEach(r => {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `<span>${r.order_date}</span><span><b>${r.order_count}</b></span>`;
      historyEl.appendChild(div);
    });
  }

  document.getElementById("saveBtn").addEventListener("click", async () => {
    if (!selectedUsername) return;
    const date = document.getElementById("dateInput").value.trim();
    const count = parseInt(document.getElementById("countInput").value, 10);

    if (!date || isNaN(count)) {
      msgEl.textContent = "تاریخ و تعداد رو کامل وارد کنید";
      msgEl.className = "error";
      return;
    }

    msgEl.textContent = "در حال ذخیره...";
    msgEl.className = "";

    const { error } = await supabaseClient
      .from("orders")
      .upsert(
        { username: selectedUsername, order_date: date, order_count: count },
        { onConflict: "username,order_date" }
      );

    if (error) {
      msgEl.textContent = "ذخیره نشد، دوباره امتحان کنید";
      msgEl.className = "error";
      return;
    }

    msgEl.textContent = "با موفقیت ثبت شد";
    msgEl.className = "ok";
    document.getElementById("dateInput").value = "";
    document.getElementById("countInput").value = "";
    await loadHistory(selectedUsername);
  });

  document.getElementById("searchBtn").addEventListener("click", searchUsers);
  document.getElementById("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") searchUsers();
  });

  searchUsers();
</script>
</body>
</html>
